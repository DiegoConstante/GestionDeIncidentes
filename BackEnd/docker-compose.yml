services:
  mysql:
    image: mysql:8.4
    command:
      - --default-authentication-plugin=mysql_native_password
      - --init-file=/opt/init.sql
    environment:
      MYSQL_ROOT_PASSWORD: root_segura
      MYSQL_DATABASE: incidentes_db
    ports:
      - "3306:3306"
    configs:
      - source: mysql_init
        target: /opt/init.sql
    volumes:
      - mysql_data:/var/lib/mysql

configs:
  mysql_init:
    content: |
      CREATE USER IF NOT EXISTS 'app_user'@'%' IDENTIFIED BY 'app_segura';
      GRANT SELECT, INSERT, UPDATE, DELETE ON incidentes_db.* TO 'app_user'@'%';
      FLUSH PRIVILEGES;

volumes:
  mysql_data:
